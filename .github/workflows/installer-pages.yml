name: Deploy installer website

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "scripts/assemble_installer_pages.py"
      - "scripts/verify_release_approval.py"
      - "scripts/build_commute_context.py"
      - "scripts/validate_context_publication.py"
      - "requirements-context.txt"
      - "release/approved/**"
      - ".github/workflows/installer-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: installer-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out current installer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest released firmware bundle
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh release view --json tagName --jq .tagName)"
          mkdir -p dist/release
          gh release download "$release_tag" \
            --pattern "transitink-zectrix-note4-v*.zip" \
            --dir dist/release
          bundles=(dist/release/*.zip)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            printf 'Expected one released firmware bundle, found %s\n' "${#bundles[@]}" >&2
            exit 1
          fi
          printf 'RELEASE_BUNDLE=%s\n' "${bundles[0]}" >> "$GITHUB_ENV"
          release_commit="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" \
            --jq .sha)"
          release_tree="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/commits/${release_commit}" \
            --jq .tree.sha)"
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          printf 'RELEASE_SOURCE_TREE=%s\n' "$release_tree" >> "$GITHUB_ENV"

      - name: Assemble installer website
        run: |
          python3 scripts/assemble_installer_pages.py \
            --release-bundle "$RELEASE_BUNDLE"

      - name: Verify exact signed-off release bytes
        run: |
          python3 scripts/verify_release_approval.py \
            --approval "release/approved/${RELEASE_TAG}.json" \
            --installer-dir dist/installer \
            --source-tree "$RELEASE_SOURCE_TREE"

      - name: Set up pinned host context environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate and validate bounded official public context
        run: |
          python3 -m pip install -r requirements-context.txt
          python3 scripts/build_commute_context.py --output dist/installer/commute-context.json
          validation_args=()
          if [[ "$RELEASE_TAG" == v1.3.2 ]]; then
            validation_args+=(--require-alternate)
          fi
          python3 scripts/validate_context_publication.py dist/installer/commute-context.json "${validation_args[@]}"

      - name: Verify the generated context with the frozen C++ parser
        if: env.RELEASE_TAG == 'v1.3.2'
        run: |
          dependency="$RUNNER_TEMP/arduinojson"
          mkdir "$dependency"
          curl --fail --silent --show-error --location --retry 2 \
            https://codeload.github.com/bblanchon/ArduinoJson/tar.gz/0b03321ed33fa6965114424fbb023260120c856b \
            --output "$dependency/source.tar.gz"
          tar -xzf "$dependency/source.tar.gz" --strip-components=1 -C "$dependency"
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -I"$dependency/src" \
            test_host/test_commute_context_json.cpp -o "$RUNNER_TEMP/transitink-context-verify"
          "$RUNNER_TEMP/transitink-context-verify" dist/installer/commute-context.json
          sha256sum dist/installer/commute-context.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload installer website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/installer

      - name: Deploy installer website
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
